name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # prebuild(getGitCommitTime)이 마지막 커밋 시각을 읽으므로 얕은 체크아웃으로 충분하다.
      - name: Build
        run: npm run build
        env:
          CI: 'false'

      # gh-pages의 -u 옵션은 RFC 5322 파서를 쓰므로 github-actions[bot] 형식의 대괄호를 받지 못한다.
      # 커밋 작성자는 전역 git 설정으로 지정한다.
      - name: Deploy to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npx gh-pages -d build --dotfiles \
            -r "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
