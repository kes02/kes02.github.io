name: Sync velog posts

on:
  schedule:
    - cron: '0 21 * * *' # 매일 06:00 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: velog-sync

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Fetch posts from velog
        run: node src/scripts/syncVelog.js

      - name: Detect changes
        id: detect
        run: |
          if [ -n "$(git status --porcelain public/velog src/data/velog.json)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit backup
        if: steps.detect.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/velog src/data/velog.json
          git commit -m "chore(velog): sync posts"
          git push origin main

      - name: Install dependencies
        if: steps.detect.outputs.changed == 'true'
        run: npm ci

      - name: Build
        if: steps.detect.outputs.changed == 'true'
        run: npm run build
        env:
          CI: 'false'

      - name: Deploy to gh-pages
        if: steps.detect.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx gh-pages -d build \
            -r "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            -u "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
