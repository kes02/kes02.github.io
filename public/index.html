<!DOCTYPE html>

        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css"
        />
        <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="32x32" />
        <link rel="icon" href="%PUBLIC_URL%/favicon.svg" type="image/svg+xml" />
        <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
        <!-- 404.html이 넘겨준 경로(/?/posts/...)를 원래 주소로 되돌린다. -->
        <script>
            (function (l) {
                if (l.search[1] === '/') {
                    var decoded = l.search.slice(1).split('&').map(function (part) {
                        return part.replace(/~and~/g, '&');
                    }).join('?');
                    window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
                }
            }(window.location));
        </script>
        <!-- Google tag (gtag.js) -->
        <script async src="https://www.googletagmanager.com/gtag/js?id=G-XHX8GFDC66"></script>

          window.dataLayer = window.dataLayer || [];
          function gtag(){dataLayer.push(arguments);}
          gtag('js', new Date());
          gtag('config', 'G-XHX8GFDC66', { send_page_view: false });
        </script>
    </head>
    <body>
        <div id="root"></div>
    </body>
</html>
